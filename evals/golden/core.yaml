# ─────────────────────────────────────────────
# Task creation — Hinglish + name resolution (mutates)
# ─────────────────────────────────────────────

- id: task-hinglish-other
  source: real
  mutates: true
  steps:
    # Assignee is the seeded no-phone teammate — a real name here would fire a
    # real WhatsApp ping (createPersonalTaskCore notifies the assignee).
    - send: "Tell Evan to send me report by tomorrow 4PM."
      expect:
        tools: [find_teammate]
        tools_none: [search_leads]
        reply_none: ["what should the title", "which priority", "what priority"]

- id: task-hinglish-self
  source: real
  mutates: true
  steps:
    - send: "Mere lie ek task bana do kal shaam chaar baje ki mujhe vera ko report bhejni hai sales ki."
      expect:
        tools: [create_personal_task]
        tool_args:
          - tool: create_personal_task
            contains: { dueAt: "T16:00" }
        reply_none: ["what should the title"]

- id: task-group-two-people
  source: synthetic
  mutates: true
  steps:
    - send: "Tell Evan and Vera to send me the sales report by tomorrow 4pm"
      expect:
        tools: [create_group_task, find_teammate]
        tool_count: { create_subtask: 2 }
        reply_none: ["how should they split", "add people in the app"]

- id: task-voice-artifact-name
  source: real
  mutates: true
  # "Evun" is a voice-transcription artifact for "Evan" (the Arapham/Arfam
  # pattern from real WhatsApp voice notes). The phonetic fallback resolves it
  # as a FUZZY match that deliberately carries NO userId — assigning requires a
  # deliberate exact-name re-lookup. CONTRACT (decided 2026-08-27, Sonnet 5
  # flip): for a SINGLE sound-alike match, decisive assignment WITH the
  # resolved name disclosed in the reply is correct (reversible action, the
  # be-decisive rule); asking first is also acceptable. What must NEVER happen:
  # a silent assignment that hides the resolved name, or searching leads for a
  # person. Multi-match ambiguity must still ask (no id is ever surfaced).
  steps:
    - send: "Evun ke lie ek task bana do send him to send a report to me at 4PM tomorrow."
      expect:
        tools: [find_teammate]
        tools_none: [search_leads]
        reply_any: ["Evan"]

- id: task-date-monday-morning
  source: real
  mutates: true
  steps:
    - send: "Monday morning remind me on Leads Follow ups after 9.0 am"
      expect:
        tools: [create_personal_task]
        tool_args:
          - tool: create_personal_task
            contains: { dueAt: "T09" }

# ─────────────────────────────────────────────
# Lead writes — log_call vs note, status flow (needs seeded test leads)
# ─────────────────────────────────────────────

- id: lead-call-vs-note
  source: synthetic
  mutates: true
  tags: [needs-seed]
  # Uses the seeded lead "Testak Evalson" (see README seeding).
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "I called Testak, no answer"
      expect:
        tools: [log_call]
        tools_none: [add_lead_note]
        tool_args:
          - tool: log_call
            contains: { outcome: "rnr" }

- id: lead-hinglish-note-plus-task
  source: real
  mutates: true
  tags: [needs-seed]
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Meri abhi Testak se baat hui hai. Achchhi lead lag, uske notes par daal do. Kal ham dubaara baat karenge, ek reminder laga dena"
      expect:
        tools: [search_leads]
        tools_any_of: [log_call, add_lead_note]
        tools_none: []

# ─────────────────────────────────────────────
# The confirmation protocol (proposal rows are SAFE — nothing mutates
# until an affirmative; these end in dismissal or no-execute checks)
# ─────────────────────────────────────────────

- id: confirm-propose-waits
  source: real
  tags: [needs-seed]
  # A PURE status ask: verify the tool is called in the SAME turn (recording
  # the proposal) and nothing executes. (Run 2 caught the model asking
  # conversationally WITHOUT calling the tool — fixed in persona.ts 2026-08-27.)
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Testak ka status touched par kar do"
      expect:
        tools: [update_lead_status]
        action_row: { action_type: update_lead_status, status: proposed }
        reply_any: ["confirm", "yes", "haan"]

- id: lead-spoke-prefers-call-log
  source: real
  mutates: true
  tags: [needs-seed]
  # "Maine abhi baat ki" (I just SPOKE to him) + a status ask: the RIGHT read
  # is a logged call (outcome conversing, auto-advances new->touched) or at
  # minimum a status proposal — never a silent nothing. Elaya herself taught
  # us this split in run 3 by counter-proposing log_call. Either path passes.
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Maine abhi Testak se baat ki, uska status touched par kar do"
      expect:
        tools_any_of: [log_call, update_lead_status]
        tools_none: [add_lead_note]

- id: confirm-no-dismisses
  source: synthetic
  tags: [needs-seed]
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Testak ka status touched kar do"
      expect:
        action_row: { status: proposed }
    - send: "no"
      expect:
        action_row_not: { status: executed }

- id: confirm-yes-but-never-executes
  source: synthetic
  tags: [needs-seed]
  # A reply that contains a yes-word inside a NEW instruction must not fire
  # the pending proposal (the classifier's whole-message rule).
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Testak ka status touched kar do"
      expect:
        action_row: { status: proposed }
    - send: "yes but actually usko lost kar do"
      expect:
        action_row_not: { action_type: update_lead_status, status: executed }

# ─────────────────────────────────────────────
# Known gaps — tracked, expected to fail today.
# When one starts passing, the gap is fixed.
# ─────────────────────────────────────────────

- id: gap-last-week-period
  source: real
  known_fail: true
  # There is no "last_week" period in the oversight vocabulary — today the
  # model substitutes this_week or this_month, a silently wrong window.
  steps:
    - send: "Give me last week's report for onboarding — what all happened?"
      expect:
        tool_args:
          - tool: get_domain_health
            contains: { period: "last_week" }

- id: gap-marathi-affirmative
  source: synthetic
  known_fail: true
  mutates: true
  tags: [needs-seed]
  # "ho kara" is a Marathi yes — the classifier only knows English + Hinglish,
  # so today this DISMISSES the proposal (safe, but wrong for the vision).
  setup:
    lead_status: { slug: testak-evalson-eval, status: new }
  steps:
    - send: "Testak ka status touched kar do"
      expect:
        action_row: { status: proposed }
    - send: "ho kara"
      expect:
        action_row: { status: executed }

- id: read-vendors-cakes
  source: synthetic
  tags: [needs-founder]
  # find_vendors / get_vendor_details are admin/founder only (the vendor tables'
  # SELECT policies); the default eval identity is a manager, so this case only
  # runs with an admin/founder EVAL_USER. On the Python brain the tool executes
  # in Node through the bridge (the one ranker) — the tool name is the check.
  steps:
    - send: "Who do we use for cakes?"
      expect:
        tools: [find_vendors]
        tools_none: [search_leads, get_helpdesk_content]

# ─────────────────────────────────────────────
# Clients (2026-09-16) — a member's WhatsApp history, read raw. The client tools scope every
# row to the reader's QUEENDOM, and a queendom is a concierge-only field (0201), while the
# eval identity is an onboarding manager (its seeded lead lives there). So these cases are
# tagged needs-concierge: run them with a concierge identity that sits in Anishqa Queendom
# (--include-tags needs-concierge). "Naina" is the busiest mapped concierge group.
# The two "nothing" cases are the anti-hallucination contract: an empty tool result
# must become "nothing on record", never a confident story.
# ─────────────────────────────────────────────

- id: client-recent-chat
  source: synthetic
  tags: [needs-concierge]
  steps:
    - send: "what has Naina been asking for lately?"
      expect:
        tools: [get_client_overview]
        tools_any_of: [get_client_recent_messages]

- id: client-search-topic
  source: synthetic
  tags: [needs-concierge]
  steps:
    - send: "did Naina ever mention Goa in her group?"
      expect:
        tools: [get_client_overview]
        tools_any_of: [search_client_history]

- id: client-search-nothing-found
  source: synthetic
  tags: [needs-concierge]
  steps:
    - send: "did Naina ever ask us to rent a submarine?"
      expect:
        tools_any_of: [search_client_history]
        reply_any: ["nothing", "no mention", "not find", "couldn't find", "could not find", "no record", "didn't find", "did not find", "no message", "nahi"]

- id: client-unknown-name
  source: synthetic
  tags: [needs-concierge]
  steps:
    - send: "tell me about our client Zorblax Quux and what he likes"
      expect:
        tools: [get_client_overview]
        tools_none: [get_client_recent_messages, search_client_history]
        reply_any: ["no client", "not find", "couldn't find", "could not find", "don't have", "do not have", "no record", "no match", "nahi"]
