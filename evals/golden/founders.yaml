# The founders' ground-truth set — v1 (2026-09-24).
#
# Every question here was asked, in these words, by a founder or the tech admin on WhatsApp or in
# the app between 12 June and 24 September 2026 (the transcript audit of 289 real turns). The
# expectations encode what a RIGHT answer did: which tool it reached for, what it must never do
# (tell the user to "send it as its own message", deny that chats exist, present a keyword count as a
# judgement), and, where the data is stable, what the reply must mention. Run with the founder role
# (`--include-tags founder`); the eval manager account cannot reach the analyst's tools.
#
# When one of these fails after a change, the change broke something a founder relied on.

# ─────────────────────────────────────────────
# The routing dead ends of 21–23 Sep (fixed by the tool catalog, 24 Sep)
# ─────────────────────────────────────────────

- id: founder-health-wellness-share
  source: real
  tags: [founder]
  steps:
    - send: "From the ticket history Tell me how many tickets we had from the very beginning in the domain of health and wellness Also give me percentage wise and among all our ticket how much is of that health and wellness category"
      expect:
        tools_any_of: [start_deep_read, query_database, get_freshdesk_overview]
        reply_none: ["ask me again", "as its own message", "not in my hands", "isn't in my hands", "nothing's changed on my end"]

- id: founder-response-time-per-queendom
  source: real
  tags: [founder]
  steps:
    - send: "What is our resolution and response time via whatsapp, not freshdesk for all 3 queendoms"
      expect:
        tools: [query_database]
        reply_any: ["Ananyshree", "Anishqa", "Sanika"]
        reply_none: ["ask me again", "as its own message", "not in my hands", "can't reach that"]

- id: founder-roster-substance
  source: real
  tags: [founder]
  steps:
    - send: "For individual concierge members, who has the highest communication on the group, whose messages have more resolution and who communicates byt does not offer substance"
      expect:
        tools: [query_database]
        reply_none: ["as its own message", "not in my hands"]
    - send: "But we have a lot more concierge managers than this Need the list for all"
      expect:
        tools: [query_database]
        reply_none: ["can't reach that computation", "send it again"]

- id: founder-active-members-queendom
  source: real
  tags: [founder]
  steps:
    - send: "How many active client of anishqa queendom"
      expect:
        tools_any_of: [query_database, list_members]
        reply_any: ["Anishqa"]
        reply_none: ["send it as its own message", "own message"]

- id: founder-zoho-balance-of-member
  source: real
  tags: [founder]
  steps:
    - send: "Can u tell me zoho balance of Arfam"
      expect:
        tools_any_of: [get_member_360, get_member_finance]
        reply_none: ["as its own message", "own message so I hit the right tool"]

- id: founder-four-asks-one-message
  source: real
  tags: [founder]
  steps:
    - send: "What do you think was the revenue today? Also give me like a pulse of the overall work due and what needs to be escalated. Can you also look at who are all the renewals for this month? Please ask murtaja to send me a cash flow today at 08:15PM."
      expect:
        tools_any_of: [get_books_overview, get_live_pulse, query_database, find_teammate, create_personal_task]
        reply_any: ["renewal"]
        reply_none: ["couldn't reach those tools", "send me \"who are the renewals"]

